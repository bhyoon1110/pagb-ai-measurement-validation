[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pagb-measurement-validation"
version = "3.0.0"
description = "Auditable evaluation tools for PAGB segmentation and planimetric grain-size measurement"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Byungjun Yoon"},
  {name = "Taehyeong Yeo"},
  {name = "Donggil Lee"},
  {name = "Gyujin Jo"},
  {name = "Byeonghoon Yoon"},
]
dependencies = [
  "numpy>=1.26,<2",
  "scipy>=1.13,<2",
  "scikit-image>=0.24,<1",
  "opencv-python-headless>=4.10,<5",
  "matplotlib>=3.9,<4",
  "Pillow>=10,<12",
  "tifffile>=2024.8",
]

[project.optional-dependencies]
training = ["torch>=2.5,<3", "torchvision>=0.20,<1"]
test = []

[project.scripts]
pagb = "pagb.cli:main"

[tool.setuptools.packages.find]
include = ["pagb*"]
